<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CodeCraftHub: Your Learning Management Platform</title>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			:root {
				--primary: #8b5cf6;
				--primary-dark: #7c3aed;
				--primary-light: #a78bfa;
				--primary-bg: #f5f3ff;
				--success: #f59e0b;
				--success-dark: #d97706;
				--danger: #ef4444;
				--danger-dark: #dc2626;
				--gray-50: #f9fafb;
				--gray-100: #f3f4f6;
				--gray-200: #e5e7eb;
				--gray-300: #d1d5db;
				--gray-400: #9ca3af;
				--gray-500: #6b7280;
				--gray-600: #4b5563;
				--gray-700: #374151;
				--gray-800: #1f2937;
				--gray-900: #111827;
				--white: #ffffff;
				--shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
				--shadow:
					0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
				--shadow-lg:
					0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
				--shadow-xl:
					0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
				--radius: 12px;
				--radius-sm: 8px;
				--transition: all 0.2s ease;
			}

			body {
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue',
					Arial, sans-serif;
				background: linear-gradient(135deg, #f5f3ff 0%, #fdf4e7 100%);
				color: var(--gray-800);
				min-height: 100vh;
				line-height: 1.6;
				padding-bottom: 40px;
			}

			/* Header */
			.header {
				background: linear-gradient(
					135deg,
					var(--primary) 0%,
					var(--primary-dark) 100%
				);
				color: var(--white);
				padding: 36px 24px 48px;
				text-align: center;
				box-shadow: var(--shadow-lg);
				position: relative;
				overflow: hidden;
			}

			.header::before {
				content: '';
				position: absolute;
				top: -50%;
				right: -10%;
				width: 300px;
				height: 300px;
				background: rgba(245, 158, 11, 0.15);
				border-radius: 50%;
			}

			.header::after {
				content: '';
				position: absolute;
				bottom: -40%;
				left: -5%;
				width: 200px;
				height: 200px;
				background: rgba(255, 255, 255, 0.08);
				border-radius: 50%;
			}

			.header h1 {
				font-size: 2rem;
				font-weight: 700;
				margin-bottom: 8px;
				position: relative;
				z-index: 1;
				letter-spacing: -0.5px;
			}

			.header p {
				font-size: 1rem;
				opacity: 0.9;
				position: relative;
				z-index: 1;
				font-weight: 300;
			}

			.header .badge {
				display: inline-block;
				background: rgba(245, 158, 11, 0.25);
				color: #fde68a;
				padding: 4px 14px;
				border-radius: 20px;
				font-size: 0.8rem;
				font-weight: 600;
				margin-top: 12px;
				position: relative;
				z-index: 1;
				letter-spacing: 0.5px;
			}

			/* Container */
			.container {
				max-width: 1100px;
				margin: -32px auto 0;
				padding: 0 20px;
				position: relative;
				z-index: 2;
			}

			/* Card */
			.card {
				background: var(--white);
				border-radius: var(--radius);
				box-shadow: var(--shadow-lg);
				padding: 28px;
				margin-bottom: 24px;
			}

			.card-title {
				font-size: 1.15rem;
				font-weight: 600;
				color: var(--gray-800);
				margin-bottom: 20px;
				display: flex;
				align-items: center;
				gap: 8px;
			}

			.card-title .icon {
				width: 28px;
				height: 28px;
				background: var(--primary-bg);
				border-radius: var(--radius-sm);
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 1rem;
			}

			/* Form */
			.form-grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 16px;
			}

			.form-group {
				display: flex;
				flex-direction: column;
			}

			.form-group.full {
				grid-column: 1 / -1;
			}

			.form-group label {
				font-size: 0.85rem;
				font-weight: 600;
				color: var(--gray-600);
				margin-bottom: 6px;
				letter-spacing: 0.2px;
			}

			.form-group label .req {
				color: var(--danger);
				margin-left: 2px;
			}

			.form-group input,
			.form-group textarea,
			.form-group select {
				padding: 10px 14px;
				border: 2px solid var(--gray-200);
				border-radius: var(--radius-sm);
				font-size: 0.95rem;
				font-family: inherit;
				color: var(--gray-800);
				background: var(--gray-50);
				transition: var(--transition);
				outline: none;
			}

			.form-group input:focus,
			.form-group textarea:focus,
			.form-group select:focus {
				border-color: var(--primary);
				background: var(--white);
				box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
			}

			.form-group input.error,
			.form-group textarea.error,
			.form-group select.error {
				border-color: var(--danger);
				background: #fef2f2;
			}

			.form-group textarea {
				resize: vertical;
				min-height: 70px;
			}

			.form-actions {
				margin-top: 20px;
				display: flex;
				gap: 12px;
				justify-content: flex-end;
			}

			/* Buttons */
			.btn {
				padding: 10px 22px;
				border: none;
				border-radius: var(--radius-sm);
				font-size: 0.9rem;
				font-weight: 600;
				cursor: pointer;
				transition: var(--transition);
				display: inline-flex;
				align-items: center;
				gap: 6px;
				font-family: inherit;
				white-space: nowrap;
			}

			.btn:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}

			.btn-primary {
				background: var(--primary);
				color: var(--white);
			}

			.btn-primary:hover:not(:disabled) {
				background: var(--primary-dark);
				transform: translateY(-1px);
				box-shadow: var(--shadow);
			}

			.btn-success {
				background: var(--success);
				color: var(--white);
			}

			.btn-success:hover:not(:disabled) {
				background: var(--success-dark);
				transform: translateY(-1px);
				box-shadow: var(--shadow);
			}

			.btn-danger {
				background: var(--danger);
				color: var(--white);
			}

			.btn-danger:hover:not(:disabled) {
				background: var(--danger-dark);
				transform: translateY(-1px);
				box-shadow: var(--shadow);
			}

			.btn-ghost {
				background: var(--gray-100);
				color: var(--gray-600);
			}

			.btn-ghost:hover:not(:disabled) {
				background: var(--gray-200);
			}

			.btn-sm {
				padding: 6px 14px;
				font-size: 0.82rem;
			}

			/* Spinner */
			.spinner {
				display: inline-block;
				width: 16px;
				height: 16px;
				border: 2px solid rgba(255, 255, 255, 0.3);
				border-top-color: var(--white);
				border-radius: 50%;
				animation: spin 0.6s linear infinite;
			}

			.spinner-lg {
				width: 40px;
				height: 40px;
				border-width: 4px;
				border-color: var(--gray-200);
				border-top-color: var(--primary);
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}

			/* Alert / Toast */
			.alert {
				padding: 12px 18px;
				border-radius: var(--radius-sm);
				font-size: 0.9rem;
				font-weight: 500;
				margin-bottom: 16px;
				display: flex;
				align-items: center;
				gap: 10px;
				animation: slideIn 0.3s ease;
			}

			.alert-success {
				background: #fef3c7;
				color: #92400e;
				border: 1px solid #fde68a;
			}

			.alert-error {
				background: #fee2e2;
				color: #991b1b;
				border: 1px solid #fecaca;
			}

			.alert .close-alert {
				margin-left: auto;
				cursor: pointer;
				opacity: 0.6;
				font-size: 1.1rem;
				background: none;
				border: none;
				color: inherit;
				padding: 0 4px;
			}

			.alert .close-alert:hover {
				opacity: 1;
			}

			@keyframes slideIn {
				from {
					opacity: 0;
					transform: translateY(-10px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			/* Loading overlay */
			.loading-state {
				text-align: center;
				padding: 60px 20px;
				color: var(--gray-400);
			}

			.loading-state p {
				margin-top: 16px;
				font-size: 0.95rem;
			}

			/* Empty state */
			.empty-state {
				text-align: center;
				padding: 48px 20px;
				color: var(--gray-400);
			}

			.empty-state .emoji {
				font-size: 3rem;
				margin-bottom: 12px;
			}

			.empty-state p {
				font-size: 1rem;
				margin-bottom: 4px;
			}

			.empty-state .sub {
				font-size: 0.85rem;
				color: var(--gray-300);
			}

			/* Course cards */
			.course-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
				gap: 20px;
			}

			.course-card {
				background: var(--white);
				border: 1px solid var(--gray-200);
				border-radius: var(--radius);
				padding: 22px;
				transition: var(--transition);
				position: relative;
				display: flex;
				flex-direction: column;
			}

			.course-card:hover {
				box-shadow: var(--shadow-lg);
				transform: translateY(-2px);
				border-color: var(--primary-light);
			}

			.course-card .course-header {
				display: flex;
				justify-content: space-between;
				align-items: flex-start;
				margin-bottom: 12px;
				gap: 10px;
			}

			.course-card h3 {
				font-size: 1.1rem;
				font-weight: 700;
				color: var(--gray-800);
				line-height: 1.3;
				flex: 1;
			}

			.course-card .course-desc {
				font-size: 0.88rem;
				color: var(--gray-500);
				margin-bottom: 16px;
				line-height: 1.5;
				flex: 1;
			}

			.course-meta {
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
				margin-bottom: 16px;
				font-size: 0.8rem;
			}

			.meta-item {
				display: flex;
				align-items: center;
				gap: 5px;
				color: var(--gray-500);
			}

			.meta-item svg {
				width: 14px;
				height: 14px;
				flex-shrink: 0;
			}

			/* Status badge */
			.status-badge {
				display: inline-block;
				padding: 4px 12px;
				border-radius: 20px;
				font-size: 0.75rem;
				font-weight: 700;
				letter-spacing: 0.3px;
				white-space: nowrap;
				flex-shrink: 0;
			}

			.status-not-started {
				background: var(--gray-100);
				color: var(--gray-600);
			}

			.status-in-progress {
				background: #fef3c7;
				color: #92400e;
			}

			.status-completed {
				background: #d1fae5;
				color: #065f46;
			}

			.course-actions {
				display: flex;
				gap: 8px;
				padding-top: 14px;
				border-top: 1px solid var(--gray-100);
			}

			.course-actions .btn {
				flex: 1;
				justify-content: center;
			}

			/* Modal */
			.modal-overlay {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				bottom: 0;
				background: rgba(17, 24, 39, 0.5);
				backdrop-filter: blur(4px);
				display: none;
				align-items: center;
				justify-content: center;
				z-index: 1000;
				padding: 20px;
				animation: fadeIn 0.2s ease;
			}

			.modal-overlay.active {
				display: flex;
			}

			@keyframes fadeIn {
				from {
					opacity: 0;
				}
				to {
					opacity: 1;
				}
			}

			.modal {
				background: var(--white);
				border-radius: var(--radius);
				box-shadow: var(--shadow-xl);
				width: 100%;
				max-width: 540px;
				max-height: 90vh;
				overflow-y: auto;
				animation: modalIn 0.25s ease;
			}

			@keyframes modalIn {
				from {
					opacity: 0;
					transform: scale(0.95) translateY(10px);
				}
				to {
					opacity: 1;
					transform: scale(1) translateY(0);
				}
			}

			.modal-header {
				padding: 20px 24px;
				border-bottom: 1px solid var(--gray-100);
				display: flex;
				justify-content: space-between;
				align-items: center;
			}

			.modal-header h2 {
				font-size: 1.2rem;
				font-weight: 700;
				color: var(--gray-800);
			}

			.modal-close {
				background: var(--gray-100);
				border: none;
				width: 32px;
				height: 32px;
				border-radius: var(--radius-sm);
				cursor: pointer;
				font-size: 1.2rem;
				color: var(--gray-500);
				display: flex;
				align-items: center;
				justify-content: center;
				transition: var(--transition);
			}

			.modal-close:hover {
				background: var(--gray-200);
				color: var(--gray-700);
			}

			.modal-body {
				padding: 24px;
			}

			.modal-footer {
				padding: 16px 24px;
				border-top: 1px solid var(--gray-100);
				display: flex;
				gap: 12px;
				justify-content: flex-end;
			}

			/* Confirm dialog */
			.confirm-modal .modal {
				max-width: 400px;
			}

			.confirm-modal .modal-body {
				text-align: center;
				padding: 32px 24px;
			}

			.confirm-icon {
				width: 56px;
				height: 56px;
				background: #fee2e2;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				margin: 0 auto 16px;
				font-size: 1.8rem;
			}

			.confirm-modal h3 {
				font-size: 1.15rem;
				font-weight: 700;
				color: var(--gray-800);
				margin-bottom: 8px;
			}

			.confirm-modal p {
				font-size: 0.9rem;
				color: var(--gray-500);
				margin-bottom: 24px;
			}

			.confirm-modal .modal-footer {
				justify-content: center;
			}

			/* Responsive */
			@media (max-width: 640px) {
				.header {
					padding: 28px 16px 40px;
				}
				.header h1 {
					font-size: 1.5rem;
				}
				.header p {
					font-size: 0.88rem;
				}
				.container {
					padding: 0 14px;
				}
				.card {
					padding: 20px;
				}
				.form-grid {
					grid-template-columns: 1fr;
				}
				.course-grid {
					grid-template-columns: 1fr;
				}
				.form-actions {
					flex-direction: column-reverse;
				}
				.form-actions .btn {
					width: 100%;
				}
			}
		</style>
		<meta property="og:image" content="https://bolt.new/static/og_default.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
	</head>
	<body>
		<header class="header">
			<h1>CodeCraftHub</h1>
			<p>Your Learning Management Platform</p>
			<span class="badge">TRACK · LEARN · GROW</span>
		</header>

		<div class="container">
			<!-- Alert container -->
			<div id="alertContainer"></div>

			<!-- Add Course Form -->
			<div class="card">
				<div class="card-title">
					<span class="icon">+</span>
					Add New Course
				</div>
				<form id="courseForm" novalidate>
					<div class="form-grid">
						<div class="form-group full">
							<label for="name">Course Name <span class="req">*</span></label>
							<input
								type="text"
								id="name"
								name="name"
								placeholder="e.g. Introduction to Python"
							/>
						</div>
						<div class="form-group full">
							<label for="description">Description <span class="req">*</span></label>
							<textarea
								id="description"
								name="description"
								placeholder="Brief description of the course..."
							></textarea>
						</div>
						<div class="form-group">
							<label for="target_date">Target Date <span class="req">*</span></label>
							<input type="date" id="target_date" name="target_date" />
						</div>
						<div class="form-group">
							<label for="status">Status <span class="req">*</span></label>
							<select id="status" name="status">
								<option value="">Select status...</option>
								<option value="Not Started">Not Started</option>
								<option value="In Progress">In Progress</option>
								<option value="Completed">Completed</option>
							</select>
						</div>
					</div>
					<div class="form-actions">
						<button type="button" class="btn btn-ghost" id="resetBtn">Reset</button>
						<button type="submit" class="btn btn-primary" id="submitBtn">
							<span id="submitText">Add Course</span>
						</button>
					</div>
				</form>
			</div>

			<!-- Course List -->
			<div class="card">
				<div class="card-title">
					<span class="icon">&#128218;</span>
					Your Courses
				</div>
				<div id="courseList">
					<div class="loading-state">
						<div class="spinner spinner-lg"></div>
						<p>Loading courses...</p>
					</div>
				</div>
			</div>
		</div>

		<!-- Edit Modal -->
		<div class="modal-overlay" id="editModal">
			<div class="modal">
				<div class="modal-header">
					<h2>Edit Course</h2>
					<button class="modal-close" id="editCloseBtn">&times;</button>
				</div>
				<div class="modal-body">
					<form id="editForm" novalidate>
						<input type="hidden" id="editId" />
						<div class="form-group full" style="margin-bottom: 16px">
							<label for="editName">Course Name <span class="req">*</span></label>
							<input type="text" id="editName" />
						</div>
						<div class="form-group full" style="margin-bottom: 16px">
							<label for="editDescription"
								>Description <span class="req">*</span></label
							>
							<textarea id="editDescription"></textarea>
						</div>
						<div
							class="form-group"
							style="
								margin-bottom: 16px;
								display: inline-block;
								width: 48%;
								padding-right: 8px;
							"
						>
							<label for="editTargetDate"
								>Target Date <span class="req">*</span></label
							>
							<input type="date" id="editTargetDate" style="width: 100%" />
						</div>
						<div
							class="form-group"
							style="
								margin-bottom: 0;
								display: inline-block;
								width: 48%;
								padding-left: 8px;
							"
						>
							<label for="editStatus">Status <span class="req">*</span></label>
							<select id="editStatus" style="width: 100%">
								<option value="Not Started">Not Started</option>
								<option value="In Progress">In Progress</option>
								<option value="Completed">Completed</option>
							</select>
						</div>
					</form>
				</div>
				<div class="modal-footer">
					<button class="btn btn-ghost" id="editCancelBtn">Cancel</button>
					<button class="btn btn-success" id="editSaveBtn">
						<span id="editSaveText">Save Changes</span>
					</button>
				</div>
			</div>
		</div>

		<!-- Delete Confirm Modal -->
		<div class="modal-overlay confirm-modal" id="deleteModal">
			<div class="modal">
				<div class="modal-body">
					<div class="confirm-icon">&#9888;</div>
					<h3>Delete Course?</h3>
					<p id="deleteMsg">
						Are you sure you want to delete this course? This action cannot be undone.
					</p>
				</div>
				<div class="modal-footer">
					<button class="btn btn-ghost" id="deleteCancelBtn">Cancel</button>
					<button class="btn btn-danger" id="deleteConfirmBtn">
						<span id="deleteConfirmText">Delete</span>
					</button>
				</div>
			</div>
		</div>

		<script>
			// A relative URL works through Vite's development proxy and in production.
			const API_URL = '/api/courses';

			// DOM refs
			const courseForm = document.getElementById('courseForm');
			const courseList = document.getElementById('courseList');
			const alertContainer = document.getElementById('alertContainer');
			const submitBtn = document.getElementById('submitBtn');
			const submitText = document.getElementById('submitText');
			const resetBtn = document.getElementById('resetBtn');

			// Edit modal refs
			const editModal = document.getElementById('editModal');
			const editForm = document.getElementById('editForm');
			const editId = document.getElementById('editId');
			const editName = document.getElementById('editName');
			const editDescription = document.getElementById('editDescription');
			const editTargetDate = document.getElementById('editTargetDate');
			const editStatus = document.getElementById('editStatus');
			const editSaveBtn = document.getElementById('editSaveBtn');
			const editSaveText = document.getElementById('editSaveText');
			const editCloseBtn = document.getElementById('editCloseBtn');
			const editCancelBtn = document.getElementById('editCancelBtn');

			// Delete modal refs
			const deleteModal = document.getElementById('deleteModal');
			const deleteMsg = document.getElementById('deleteMsg');
			const deleteConfirmBtn = document.getElementById('deleteConfirmBtn');
			const deleteConfirmText = document.getElementById('deleteConfirmText');
			const deleteCancelBtn = document.getElementById('deleteCancelBtn');

			let deleteTargetId = null;
			let courses = [];

			// ---- Alert system ----
			function showAlert(message, type) {
				alertContainer.innerHTML = '';
				const alert = document.createElement('div');
				alert.className = `alert alert-${type}`;
				alert.innerHTML = `<span>${escapeHtml(message)}</span><button class="close-alert">&times;</button>`;
				alertContainer.appendChild(alert);
				alert
					.querySelector('.close-alert')
					.addEventListener('click', () => alert.remove());
				setTimeout(() => {
					if (alert.parentNode) alert.remove();
				}, 5000);
			}

			function clearAlerts() {
				alertContainer.innerHTML = '';
			}

			// ---- Utility ----
			function escapeHtml(str) {
				if (str == null) return '';
				const div = document.createElement('div');
				div.textContent = String(str);
				return div.innerHTML;
			}

			function formatDate(dateStr) {
				if (!dateStr) return 'N/A';
				const d = new Date(dateStr);
				if (isNaN(d.getTime())) return dateStr;
				return d.toLocaleDateString('en-US', {
					year: 'numeric',
					month: 'short',
					day: 'numeric',
				});
			}

			function statusClass(status) {
				switch (status) {
					case 'Not Started':
						return 'status-not-started';
					case 'In Progress':
						return 'status-in-progress';
					case 'Completed':
						return 'status-completed';
					default:
						return 'status-not-started';
				}
			}

			function setLoadingBtn(btn, textEl, loading, loadingText, normalText) {
				if (loading) {
					btn.disabled = true;
					textEl.innerHTML = '<span class="spinner"></span>';
					if (loadingText) textEl.textContent = loadingText;
				} else {
					btn.disabled = false;
					textEl.textContent = normalText;
				}
			}

			// ---- Validation ----
			function validateForm(name, description, targetDate, status) {
				const errors = [];
				if (!name || !name.trim()) errors.push('Course name is required');
				if (!description || !description.trim())
					errors.push('Description is required');
				if (!targetDate) errors.push('Target date is required');
				else if (!/^\d{4}-\d{2}-\d{2}$/.test(targetDate))
					errors.push('Target date must be in YYYY-MM-DD format');
				if (!status) errors.push('Status is required');
				return errors;
			}

			function highlightErrors(errors, fields) {
				// Clear previous
				Object.values(fields).forEach((f) => {
					if (f && f.classList) f.classList.remove('error');
				});
				if (errors.includes('Course name is required') && fields.name)
					fields.name.classList.add('error');
				if (errors.includes('Description is required') && fields.description)
					fields.description.classList.add('error');
				if (
					(errors.includes('Target date is required') ||
						errors.includes('Target date must be in YYYY-MM-DD format')) &&
					fields.targetDate
				)
					fields.targetDate.classList.add('error');
				if (errors.includes('Status is required') && fields.status)
					fields.status.classList.add('error');
			}

			// ---- API calls ----
			async function fetchCourses() {
				courseList.innerHTML = `
        <div class="loading-state">
          <div class="spinner spinner-lg"></div>
          <p>Loading courses...</p>
        </div>`;
				try {
					const res = await fetch(API_URL);
					if (!res.ok)
						throw new Error(`Failed to fetch courses (HTTP ${res.status})`);
					const data = await res.json();
					courses = Array.isArray(data) ? data : data.courses || [];
					renderCourses();
				} catch (err) {
					courseList.innerHTML = `
          <div class="empty-state">
            <div class="emoji">&#9888;</div>
            <p>Could not load courses</p>
            <p class="sub">${escapeHtml(err.message)}</p>
          </div>`;
					showAlert(
						'Failed to load courses. Make sure the API server is running.',
						'error',
					);
				}
			}

			async function createCourse(payload) {
				const res = await fetch(API_URL, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(payload),
				});
				if (!res.ok) {
					let msg = `Failed to create course (HTTP ${res.status})`;
					try {
						const e = await res.json();
						if (e.message || e.error) msg = e.message || e.error;
					} catch (_) {}
					throw new Error(msg);
				}
				return await res.json();
			}

			async function updateCourse(id, payload) {
				const res = await fetch(`${API_URL}/${id}`, {
					method: 'PUT',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(payload),
				});
				if (!res.ok) {
					let msg = `Failed to update course (HTTP ${res.status})`;
					try {
						const e = await res.json();
						if (e.message || e.error) msg = e.message || e.error;
					} catch (_) {}
					throw new Error(msg);
				}
				return await res.json();
			}

			async function deleteCourse(id) {
				const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
				if (!res.ok && res.status !== 204) {
					let msg = `Failed to delete course (HTTP ${res.status})`;
					try {
						const e = await res.json();
						if (e.message || e.error) msg = e.message || e.error;
					} catch (_) {}
					throw new Error(msg);
				}
				return true;
			}

			// ---- Render ----
			function renderCourses() {
				if (courses.length === 0) {
					courseList.innerHTML = `
          <div class="empty-state">
            <div class="emoji">&#128218;</div>
            <p>No courses yet</p>
            <p class="sub">Add your first course using the form above</p>
          </div>`;
					return;
				}

				courseList.innerHTML = '<div class="course-grid"></div>';
				const grid = courseList.querySelector('.course-grid');

				courses.forEach((course) => {
					const card = document.createElement('div');
					card.className = 'course-card';
					card.innerHTML = `
          <div class="course-header">
            <h3>${escapeHtml(course.name)}</h3>
            <span class="status-badge ${statusClass(course.status)}">${escapeHtml(course.status || 'Not Started')}</span>
          </div>
          <p class="course-desc">${escapeHtml(course.description)}</p>
          <div class="course-meta">
            <span class="meta-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              ${formatDate(course.target_date)}
            </span>
            ${
													course.created_at
														? `<span class="meta-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              Added ${formatDate(course.created_at)}
            </span>`
														: ''
												}
          </div>
          <div class="course-actions">
            <button class="btn btn-ghost btn-sm edit-btn" data-id="${course.id}">Edit</button>
            <button class="btn btn-danger btn-sm delete-btn" data-id="${course.id}">Remove</button>
          </div>
        `;
					grid.appendChild(card);
				});

				// Attach event listeners
				grid.querySelectorAll('.edit-btn').forEach((btn) => {
					btn.addEventListener('click', () => openEditModal(btn.dataset.id));
				});
				grid.querySelectorAll('.delete-btn').forEach((btn) => {
					btn.addEventListener('click', () => openDeleteModal(btn.dataset.id));
				});
			}

			// ---- Form submit (Add) ----
			courseForm.addEventListener('submit', async (e) => {
				e.preventDefault();
				clearAlerts();

				const name = document.getElementById('name').value;
				const description = document.getElementById('description').value;
				const targetDate = document.getElementById('target_date').value;
				const status = document.getElementById('status').value;

				const fields = {
					name: document.getElementById('name'),
					description: document.getElementById('description'),
					targetDate: document.getElementById('target_date'),
					status: document.getElementById('status'),
				};

				const errors = validateForm(name, description, targetDate, status);
				if (errors.length > 0) {
					highlightErrors(errors, fields);
					showAlert(errors[0], 'error');
					return;
				}

				highlightErrors([], fields);
				setLoadingBtn(submitBtn, submitText, true, '', '');

				try {
					const created = await createCourse({
						name,
						description,
						target_date: targetDate,
						status,
					});
					showAlert('Course added successfully!', 'success');
					courseForm.reset();
					await fetchCourses();
				} catch (err) {
					showAlert(err.message, 'error');
				} finally {
					setLoadingBtn(submitBtn, submitText, false, '', 'Add Course');
				}
			});

			resetBtn.addEventListener('click', () => {
				courseForm.reset();
				clearAlerts();
				document
					.querySelectorAll('.error')
					.forEach((el) => el.classList.remove('error'));
			});

			// ---- Edit modal ----
			function openEditModal(id) {
				const course = courses.find((c) => String(c.id) === String(id));
				if (!course) return;

				editId.value = course.id;
				editName.value = course.name || '';
				editDescription.value = course.description || '';
				editTargetDate.value = course.target_date || '';
				editStatus.value = course.status || 'Not Started';

				editName.classList.remove('error');
				editDescription.classList.remove('error');
				editTargetDate.classList.remove('error');
				editStatus.classList.remove('error');

				editModal.classList.add('active');
			}

			function closeEditModal() {
				editModal.classList.remove('active');
			}

			editCloseBtn.addEventListener('click', closeEditModal);
			editCancelBtn.addEventListener('click', closeEditModal);
			editModal.addEventListener('click', (e) => {
				if (e.target === editModal) closeEditModal();
			});

			editSaveBtn.addEventListener('click', async () => {
				const name = editName.value;
				const description = editDescription.value;
				const targetDate = editTargetDate.value;
				const status = editStatus.value;

				const fields = {
					name: editName,
					description: editDescription,
					targetDate: editTargetDate,
					status: editStatus,
				};
				const errors = validateForm(name, description, targetDate, status);

				if (errors.length > 0) {
					highlightErrors(errors, fields);
					showAlert(errors[0], 'error');
					return;
				}

				highlightErrors([], fields);
				setLoadingBtn(editSaveBtn, editSaveText, true, '', '');

				try {
					await updateCourse(editId.value, {
						name,
						description,
						target_date: targetDate,
						status,
					});
					showAlert('Course updated successfully!', 'success');
					closeEditModal();
					await fetchCourses();
				} catch (err) {
					showAlert(err.message, 'error');
				} finally {
					setLoadingBtn(editSaveBtn, editSaveText, false, '', 'Save Changes');
				}
			});

			// ---- Delete modal ----
			function openDeleteModal(id) {
				const course = courses.find((c) => String(c.id) === String(id));
				deleteTargetId = id;
				if (course) {
					deleteMsg.textContent = `Are you sure you want to delete "${course.name}"? This action cannot be undone.`;
				}
				deleteModal.classList.add('active');
			}

			function closeDeleteModal() {
				deleteModal.classList.remove('active');
				deleteTargetId = null;
			}

			deleteCancelBtn.addEventListener('click', closeDeleteModal);
			deleteModal.addEventListener('click', (e) => {
				if (e.target === deleteModal) closeDeleteModal();
			});

			deleteConfirmBtn.addEventListener('click', async () => {
				if (!deleteTargetId) return;
				setLoadingBtn(deleteConfirmBtn, deleteConfirmText, true, '', '');

				try {
					await deleteCourse(deleteTargetId);
					showAlert('Course deleted successfully!', 'success');
					closeDeleteModal();
					await fetchCourses();
				} catch (err) {
					showAlert(err.message, 'error');
					closeDeleteModal();
				} finally {
					setLoadingBtn(deleteConfirmBtn, deleteConfirmText, false, '', 'Delete');
				}
			});

			// ---- Init ----
			fetchCourses();
		</script>
	</body>
</html>
